services:
  - type: web
    name: stockr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard
    healthCheckPath: /health
    autoDeploy: true
